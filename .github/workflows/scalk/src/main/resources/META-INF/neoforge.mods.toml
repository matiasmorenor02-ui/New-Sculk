Un bosque de abedules (basado en el old growth birch forest) corrompido por scalk,
el sculk marron-morado. Madera y hojas drenadas, parches largos de scalk y venas sobre los troncos.
'''

[[dependencies.scalk]]
modId = "neoforge"
type = "required"
versionRange = "[26.3,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.scalk]]
